<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Kakao Map Route + GPS</title>

  <!-- Kakao Map SDK -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=18daa2632f3904b11cea2f0610fd6198&libraries=services"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    #container {
      display: flex;
      height: 100vh;
    }

    #sidebar {
      width: 320px;
      padding: 16px;
      background: #fafafa;
      border-right: 1px solid #ddd;
      box-sizing: border-box;
    }

    #map {
      flex: 1;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 8px;
      font-size: 14px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-bottom: 8px;
      font-size: 14px;
      border: none;
      cursor: pointer;
      border-radius: 6px;
    }

    #routeBtn {
      background-color: #5366FB;
      color: white;
      font-weight: bold;
    }

    #gpsBtn {
      background: #eaeaea;
    }

    #stopBtn {
      background: #ff4d4d;
      color: white;
    }

    .destBtn {
      background: #ffffff;
      border: 1px solid #ddd;
    }

    .result {
      margin-top: 12px;
      padding: 10px;
      background: #fff;
      border: 1px solid #ddd;
    }
  </style>
</head>
<body>

<div id="container">
  <div id="sidebar">
    <h3>경로 계산</h3>

    <input id="startInput" placeholder="출발지 (예: 서울역)">

    <button id="gpsBtn" onclick="startTracking()">📍 내 위치를 출발지로</button>
    <button id="stopBtn" onclick="stopTracking()" style="display:none;">⏹ 추적 중지</button>

    <input id="endInput" placeholder="도착지" readonly>

    <!-- 고정 도착지 버튼 -->
    <button class="destBtn" onclick="selectFixedDestination('동대구역')">동대구역</button>
    <button class="destBtn" onclick="selectFixedDestination('용산역')">용산역</button>
    <button class="destBtn" onclick="selectFixedDestination('대곡역')">대곡역</button>

    <button id="routeBtn" onclick="searchPlaces()">경로 계산</button>

    <div class="result">
      <div>거리: <span id="distance">-</span></div>
      <div>예상 시간: <span id="time">-</span></div>
    </div>
  </div>

  <div id="map"></div>
</div>

<script>
  /* 실제 검색용 도착지 매핑 */
  const DEST_MAP = {
    "동대구역": "동대구역 1호선",
    "용산역": "용산역 2호선",
    "대곡역": "대곡역 1호선"
  };

  const map = new kakao.maps.Map(document.getElementById("map"), {
    center: new kakao.maps.LatLng(37.5665, 126.9780),
    level: 5
  });

  const ps = new kakao.maps.services.Places();

  let startMarker = null;
  let endMarker = null;
  let polyline = null;

  let startPos = null;
  let endPos = null;
  let watchId = null;

  /* 실시간 GPS 추적 시작 */
  function startTracking() {
    if (!navigator.geolocation) {
      alert("위치 서비스를 지원하지 않는 브라우저입니다.");
      return;
    }

    document.getElementById("gpsBtn").style.display = "none";
    document.getElementById("stopBtn").style.display = "block";

    watchId = navigator.geolocation.watchPosition(
            pos => {
              const lat = pos.coords.latitude;
              const lng = pos.coords.longitude;
              startPos = new kakao.maps.LatLng(lat, lng);

              // 마커 업데이트
              if (startMarker) {
                startMarker.setPosition(startPos);
              } else {
                startMarker = new kakao.maps.Marker({ position: startPos, map });
              }

              map.setCenter(startPos);
              document.getElementById("startInput").value = "내 위치";

              // 서버에 위치 전송
              fetch("/api/location", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ lat, lng, timestamp: Date.now() })
              });

              // 도착지가 선택된 상태면 경로 자동 재계산
              if (endPos) {
                requestRoute();
              }
            },
            err => console.log("위치 오류:", err.message), // alert → console.log
            { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
    );
  }

  /* 실시간 GPS 추적 중지 */
  function stopTracking() {
    if (watchId !== null) {
      navigator.geolocation.clearWatch(watchId);
      watchId = null;
    }
    document.getElementById("stopBtn").style.display = "none";
    document.getElementById("gpsBtn").style.display = "block";
  }

  /* 페이지 벗어날 때 자동 중지 */
  window.addEventListener("beforeunload", stopTracking);

  /* 고정 도착지 선택 */
  function selectFixedDestination(label) {
    const keyword = DEST_MAP[label];

    document.getElementById("endInput").value = keyword;
    endPos = null;

    ps.keywordSearch(keyword, (data, status) => {
      if (status !== kakao.maps.services.Status.OK) {
        alert("도착지 검색 실패");
        return;
      }

      endPos = new kakao.maps.LatLng(data[0].y, data[0].x);

      if (endMarker) endMarker.setMap(null);
      endMarker = new kakao.maps.Marker({ position: endPos, map });

      map.setCenter(endPos);
    });
  }

  /* 출발지 / 도착지 검색 */
  function searchPlaces() {
    const start = document.getElementById("startInput").value;

    if (!startPos && !start) {
      alert("출발지를 입력하거나 GPS를 사용하세요.");
      return;
    }

    if (!endPos) {
      alert("도착지를 선택하세요.");
      return;
    }

    if (!startPos) {
      ps.keywordSearch(start, (data, status) => {
        if (status !== kakao.maps.services.Status.OK) {
          alert("출발지 검색 실패");
          return;
        }

        startPos = new kakao.maps.LatLng(data[0].y, data[0].x);

        if (startMarker) startMarker.setMap(null);
        startMarker = new kakao.maps.Marker({ position: startPos, map });

        requestRoute();
      });
    } else {
      requestRoute();
    }
  }

  /* 서버에 경로 요청 */
  function requestRoute() {
    fetch(`/api/route?startLat=${startPos.getLat()}&startLng=${startPos.getLng()}&endLat=${endPos.getLat()}&endLng=${endPos.getLng()}`)
            .then(res => res.json())
            .then(drawRoute)
            .catch(err => console.log("경로 요청 오류:", err));
  }

  /* 경로 표시 */
  function drawRoute(data) {
    if (!data.routes || !data.routes[0]) {
      console.log("경로 데이터 없음");
      return;
    }

    if (polyline) polyline.setMap(null);

    const summary = data.routes[0].summary;
    const roads = data.routes[0].sections[0].roads;

    document.getElementById("distance").innerText =
            (summary.distance / 1000).toFixed(2) + " km";
    document.getElementById("time").innerText =
            Math.round(summary.duration / 60) + " 분";

    const path = [];
    roads.forEach(r => {
      for (let i = 0; i < r.vertexes.length; i += 2) {
        path.push(new kakao.maps.LatLng(r.vertexes[i + 1], r.vertexes[i]));
      }
    });

    polyline = new kakao.maps.Polyline({
      path,
      strokeWeight: 5,
      strokeColor: "#ff0000",
      strokeOpacity: 0.9
    });

    polyline.setMap(map);

    const bounds = new kakao.maps.LatLngBounds();
    path.forEach(p => bounds.extend(p));
    map.setBounds(bounds);
  }
</script>

</body>
</html>
